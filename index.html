<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Para mi papoi 💛</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="fondo" aria-hidden="true"></div>

  <!-- Pantalla de entrada -->
  <section id="entrada">
    <h1 class="titulo">Para mi papoi linda 💛</h1>
    <div class="escena">
      <p class="burbuja">¡Papoi, dale click y recuerda que eres linda!</p>
      <button id="sprite" type="button" aria-label="Papoi: tócala para soltar corazones">
        <img src="fotos/papoi-recorte.webp" alt="Paula, mi papoi, mandando besos" width="1145" height="1271">
      </button>
    </div>
    <button id="abrir" class="boton" type="button">Ábrelo, mi amor</button>
  </section>

  <!-- Página principal -->
  <main id="principal" hidden>
    <section class="aula">
      <h2 class="titulo" id="titulo-motivos"></h2>
      <div class="clase">
        <div class="profe" aria-hidden="true">
          <img src="fotos/papoi-recorte.webp" alt="" width="1145" height="1271">
          <span class="puntero"></span>
        </div>
        <div class="tablero">
          <p class="contador" id="contador" aria-live="polite"></p>
          <div class="scroller" id="scroller" tabindex="0" aria-labelledby="titulo-motivos">
            <div class="track" id="track"></div>
          </div>
        </div>
      </div>
      <div class="acciones">
        <button id="btn-mensaje" class="boton" type="button">Un mensaje para ti</button>
      </div>
    </section>

    <div class="tv">
      <div class="pantalla">
        <div class="slide"><img class="bg" alt="" aria-hidden="true"><img class="fg" alt="Recuerdo para Paula"></div>
        <div class="slide"><img class="bg" alt="" aria-hidden="true"><img class="fg" alt="Recuerdo para Paula"></div>
      </div>
      <div class="panel" aria-hidden="true"><span></span><span></span><i></i></div>
    </div>
  </main>

  <dialog id="mensaje">
    <p id="mensaje-texto"></p>
    <form method="dialog"><button class="boton" type="submit">Te amo 💛</button></form>
  </dialog>

  <!-- Reproductor de música: la margarita gira mientras suena -->
  <div id="radio" hidden>
    <p class="aviso" id="aviso">Aquí puedes silenciar la música 🎵</p>
    <button id="margarita" type="button" aria-pressed="false" aria-label="Silenciar música">
      <svg viewBox="-50 -50 100 100" aria-hidden="true">
        <g fill="#fff" stroke="#E8B4B8" stroke-width="1.5">
          <ellipse rx="9" ry="22" cy="-24"/><ellipse rx="9" ry="22" cy="-24" transform="rotate(30)"/>
          <ellipse rx="9" ry="22" cy="-24" transform="rotate(60)"/><ellipse rx="9" ry="22" cy="-24" transform="rotate(90)"/>
          <ellipse rx="9" ry="22" cy="-24" transform="rotate(120)"/><ellipse rx="9" ry="22" cy="-24" transform="rotate(150)"/>
          <ellipse rx="9" ry="22" cy="-24" transform="rotate(180)"/><ellipse rx="9" ry="22" cy="-24" transform="rotate(210)"/>
          <ellipse rx="9" ry="22" cy="-24" transform="rotate(240)"/><ellipse rx="9" ry="22" cy="-24" transform="rotate(270)"/>
          <ellipse rx="9" ry="22" cy="-24" transform="rotate(300)"/><ellipse rx="9" ry="22" cy="-24" transform="rotate(330)"/>
        </g>
        <circle r="13" fill="#F2C230" stroke="#C9A227" stroke-width="2"/>
      </svg>
      <span class="tachado" aria-hidden="true"></span>
    </button>
    <div id="yt" aria-hidden="true"></div>
  </div>

  <script src="fotos.js"></script>
  <script src="motivos.js"></script>
  <script src="script.js"></script>
  <script src="https://www.youtube.com/iframe_api" async></script>
</body>
</html>
